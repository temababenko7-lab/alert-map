#ph small{color:#8e93a0;font-size:14px}

#px{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid #3b414d;background:#262a33;color:#fff;font-size:20px;line-height:1}

.dt{display:flex;align-items:center;gap:12px;color:#aab0bd;font-size:14px;margin:16px 0 10px}
.dt:after{content:"";flex:1;height:1px;background:#3a3f4b}
.cd{border:1px solid #3a3f4b;background:#2b2f38;border-radius:16px;padding:14px 16px}
.cd.on{background:#453c2b;border-color:#a08a3a}
.ct{display:flex;gap:12px;align-items:flex-start}
.ci{flex:none;width:38px;height:38px;border-radius:50%;background:#c9a233;display:flex;align-items:center;justify-content:center}
.ci svg{display:block}
.ci.l0{background:#7b8190}.ci.l2{background:#d0605a}.ci.l1{background:#c9a233}.ci.st{background:#4cae82}.ci.ch{background:#c27df0}.ci.ra{background:#e2cf5f}
.cm{flex:1;min-width:0}

.bg{flex:none;border:1px solid #a08a3a;color:#e0c04a;border-radius:7px;font-size:13px;padding:3px 8px}

.msg{color:#aab0bd;padding:26px 4px;text-align:center;font-size:15px}

#tl{left:12px}#tr{right:12px}#tr.del{color:#e0675a;font-size:20px}

.row+.row,.row+.thr,.card>.thr+.thr{border-top:1px solid #2c2c2e}
.row b{display:block;font-size:17px;font-weight:500}

.rc{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rc.ok,.big.ok{background:#3478f6}.rc.c1,.big.c1{background:#ffd60a}.rc.c2,.big.c2{background:#e0554a}

function getJSON(u){
  return new Promise((res,rej)=>{
    const tm=setTimeout(()=>rej(new Error('таймаут')),12000);
    fetch(u).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
      .then(x=>{clearTimeout(tm);try{res(JSON.parse(x))}catch(e){rej(new Error('не JSON'))}})
      .catch(e=>{clearTimeout(tm);rej(e)});
  });
}
const typeOf=t=>{t=String(t||'').toLowerCase();return t.startsWith('dist')||t==='raion'?'district':t.startsWith('comm')||t==='hromada'?'community':'state'};
let regs=null;
async function srcTryvoha(w){
  if(!regs){const j=await getJSON(w('https://tryvoha.online/api/v1/regions'));const m={};(j.regions||j).forEach(r=>m[r.slug]=r);regs=m}
  const j=await getJSON(w('https://tryvoha.online/api/v1/alerts'));
  return (j.alerts||j).map(a=>{
    const r=regs[a.slug]||{},ob=regs[r.oblast_slug]||{};
    return {id:r.id,name:r.name_uk||a.name_uk||a.name,type:typeOf(r.type||a.type),oblast:ob.name_uk||'',level:a.level==='yellow'?'yellow':'red',started:a.started_at};
  }).filter(e=>e.name);
}
async function srcSiren(w){
  const j=await getJSON(w('https://siren.pp.ua/api/v3/alerts'));
  const out=[];
  (Array.isArray(j)?j:(j.alerts||[])).forEach(it=>{
    const act=(it.activeAlerts||[]).filter(a=>!a.type||a.type==='AIR');
    if(!act.length)return;
    const lv=act.flatMap(a=>(a.activeAlertLevels||[]).map(x=>String(x.alertLevel||'').toLowerCase()));
    out.push({id:it.regionId,name:it.regionName,type:typeOf(it.regionType),oblast:'',level:lv.includes('red')||!lv.includes('yellow')?'red':'yellow',started:act[0].lastUpdate||it.lastUpdate,strictId:true});
  });

}
async function srcUbilling(w){
  const j=await getJSON(w('https://ubilling.net.ua/aerialalerts/'));

function paint(entries){
  const st=new Map(),hit=new Set(),states=[],comm=new Map();
  const put=(u,e,part)=>{
    const lvl=e.level==='yellow'?1:2;
    const fresh=!!e.started&&Date.now()-Date.parse(e.started)<600000;
    const c=st.get(u);
    if(c){
      if(c.lvl>lvl)return;
      if(c.lvl===lvl&&!c.part&&part)return;
      if(c.lvl===lvl&&c.part===part){c.fresh=c.fresh&&fresh;return}
    }
    st.set(u,{lvl,fresh,part});
  };
  entries.forEach(e=>{
    if(e.type==='state'){states.push(e);return}
    let u=null;
    if(e.type==='community'){
      const c=e.id!=null&&GEO.C[e.id];
      if(c&&norm(c[1])===norm(e.name)){u=unitById[c[0]];comm.set(String(e.id),{lvl:e.level==='yellow'?1:2})}
    }else{
      const c=e.id!=null&&unitById[e.id];
      if(c&&norm(c.n)===norm(e.name))u=c;
      else u=unitByName[norm(e.name)+'|'+norm(e.oblast)]||null;
    }
    if(!u)return;
    hit.add(u.o);put(u,e,e.type==='community');
  });
  states.forEach(e=>{
    const o=(e.id!=null&&oblById[e.id]&&norm(oblById[e.id].n)===norm(e.name)&&oblById[e.id])||oblByName[norm(e.name)];
    if(!o)return;
    const bu=unitById[o.i];
    if(bu&&bu.base)put(bu,e,false);
    if(hit.has(o.i))return;
    (unitsByObl[o.i]||[]).forEach(u=>put(u,e,false));
  });
  GEO.U.forEach(u=>{
    const s=st.get(u),cl=u.el.classList;u.s=s||null;
    cl.remove('alert','new','part','warn');
    if(!s)return;
    if(s.lvl===1)cl.add('warn');
    else if(s.part)cl.add('part');
    else cl.add(s.fresh?'new':'alert');
  });
  logLevels();COMM=comm;afterPaint();
}
let busy=false;
async function tick(){
  if(busy)return;busy=true;
  const t2=document.getElementById('t2');
  let ok=null,errs=[];
  for(const [name,fn] of SOURCES){
    try{const e=await fn();paint(e);ok=name;break}catch(err){errs.push(name+': '+(err&&err.message||err))}
  }
  if(ok){
    t2.className='';
    t2.textContent=new Date().toLocaleString('uk-UA',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+' · '+ok;
  }else{
    t2.className='err';t2.textContent='немає зв’язку з джерелом ('+errs[0]+')';
    console.warn(errs.join('\n'));
  }
  busy=false;
  pollOther().catch(()=>{});
}

function logLevels(){

    const lvl=u.s&&u.s.lvl?u.s.lvl:0,a=LOG[u.i]||(LOG[u.i]=[]),l=a[a.length-1];

function epLevel(u,ep,a,b){
  let api=0;
  (function scan(o,d){
    if(api||!o||d>3)return;
    if(Array.isArray(o)){o.forEach(x=>scan(x,d+1));return}
    if(typeof o!=='object')return;
    for(const k in o){
      const v=o[k];
      if(/level|severity|threat|рівень/i.test(k)){
        if(typeof v==='string'||typeof v==='number'){const r=lvlFromText(v);if(r){api=r;return}}
        else scan(v,d+1);

    }
  })(ep,0);
  if(api)return api;

  $('pks').innerHTML='<div class="sh">'+(L?'<button class="pb" id="pkb">‹</button>':'<button class="pb" id="pkb">Close</button>')+'<div class="t">'+esc(title)+'</div><button class="pb sel'+(PK.sel?' on':'')+'" id="pks2">Select</button></div>'
    +'<div class="sq"><span style="color:#8e8e93">🔍</span><input id="pkq" placeholder="Search" autocomplete="off" value="'+esc(PK.q)+'"></div>'
    +'<div class="pl2" id="pkl">'+PK.rows.map((r,i)=>'<div class="row'+(r.h?' h':'')+'" data-i="'+i+'">'+(r.pick?'<span class="ck">'+(r.chk?'✓':'')+'</span>':'')+'<div><b>'+esc(r.t)+'</b>'+(r.sub?'<small>'+esc(r.sub)+'</small>':'')+'</div>'+(r.go?'<i>›</i>':'')+'</div>').join('')+(PK.rows.length?'':'<div class="empty">Nothing found</div>')+'</div>';
  const inp=$('pkq');
  inp.oninput=()=>{PK.q=inp.value;const p=inp.selectionStart;drawPicker();const n=$('pkq');n.focus();n.setSelectionRange(p,p)};
}
$('pks').addEventListener('click',e=>{
  if(!PK)return;
  if(e.target.closest('#pkb')){
    if(PK.lvl===0)return closePicker();
    PK.q='';if(PK.lvl===2)Object.assign(PK,{lvl:1,u:null});else Object.assign(PK,{lvl:0,o:null});
    return drawPicker();
  }
  if(e.target.closest('#pks2')){
    if(!PK.sel)return;
    if(!SAVED.some(x=>x.k===PK.sel.k)){SAVED.push(PK.sel);store.set('saved',SAVED)}
    closePicker();SEL=null;if(TAB!=='alerts')showTab('alerts');else{renderAlerts();header()}
    return;
  }
  const r=e.target.closest('.row[data-i]');

  const row=PK.rows[+r.dataset.i];
  if(row.go){PK.q='';Object.assign(PK,row.go);drawPicker();$('pkl').scrollTop=0}
  else if(row.pick){PK.sel=PK.sel&&PK.sel.k===row.pick.k?null:row.pick;const sc=$('pkl').scrollTop;drawPicker();$('pkl').scrollTop=sc}
});
$('pk').addEventListener('click',e=>{if(e.target===$('pk'))closePicker()});

  if(TAB==='alerts'&&!PK&&!$('gm').classList.contains('on'))renderAlerts()}
/* ---------- звук и уведомления ---------- */
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
['pointerdown','keydown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{if(store.get('snd',true))ac()},{passive:true}));
function sirenSound(sweeps){
  const a=ac();if(!a)return;
  const t=a.currentTime,n=sweeps||4,o=a.createOscillator(),g=a.createGain();
  o.type='triangle';o.frequency.setValueAtTime(430,t);
  for(let i=0;i<n;i++){o.frequency.linearRampToValueAtTime(840,t+i*1.6+.8);o.frequency.linearRampToValueAtTime(430,t+i*1.6+1.6)}
  const end=t+n*1.6;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.15);g.gain.setValueAtTime(.4,end-.2);g.gain.exponentialRampToValueAtTime(.0001,end);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(end+.05);
}
function clearSound(){
  const a=ac();if(!a)return;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
    const t=a.currentTime+i*.28,o=a.createOscillator(),g=a.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.9);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.95);
  });
}
function where(n){
  if(n==='м. Київ')return 'в м. Києві';
  if(/Крим/.test(n))return 'в Автономній Республіці Крим';
  let m;
  if(m=n.match(/^(.+) район$/)){
    if(/ий$/.test(m[1]))return 'в '+m[1].replace(/ий$/,'ому')+' районі';
    if(/ій$/.test(m[1]))return 'в '+m[1].replace(/ій$/,'ьому')+' районі';
  }
  if(m=n.match(/^(.+) область$/)){if(/а$/.test(m[1]))return 'в '+m[1].replace(/а$/,'ій')+' області'}
  if(m=n.match(/^(.+) територіальна громада$/)){
    const ws=m[1].split(' '),cj=w=>/^(та|і|й)$/i.test(w);
    if(ws.every(w=>cj(w)||(!/^м\./.test(w)&&/(ька|ична|ова|на)$/.test(w))))return 'в '+ws.map(w=>cj(w)?w:w.replace(/а$/,'ій')).join(' ')+' територіальній громаді';
  }
  return '— '+n;
}
const MSG={
  yellow:n=>'🟡 Увага! повітряна тривога (жовтий рівень, загроза БпЛА) '+where(n)+'. Будьте обережні, при потребі прямуйте в укриття.',
  red:n=>'🔴 Увага! повітряна тривога (червоний рівень) '+where(n)+'. Негайно прямуйте в укриття!',
  up:n=>'🔴 Увага! тривога посилилась до червоного рівня '+where(n)+'. Негайно в укриття!',
  down:n=>'🟡 Увага! рівень тривоги знизився до жовтого '+where(n)+'. Тривога триває, залишайтесь в укритті.',
  clear:n=>'🟢 Увага! відбій повітряної тривоги '+where(n),
  street:n=>'🟣 Увага! загроза вуличних боїв '+where(n)+'. Залишайтесь у приміщенні, не виходьте на вулицю.',
  chem:n=>'☣️ Увага! хімічна небезпека '+where(n)+'. Зачиніть вікна й двері, залишайтесь у приміщенні.',
  rad:n=>'☢️ Увага! радіаційна небезпека '+where(n)+'. Залишайтесь у приміщенні, зачиніть вікна й двері.',
  oclear:(k,n)=>'🟢 Увага! відбій загрози ('+({street:'вуличні бої',chem:'хімічна небезпека',rad:'радіаційна небезпека'}[k])+') '+where(n)
};
MSG.start=(n,l)=>l===1?MSG.yellow(n):MSG.red(n);
function toast(text,cls){
  let box=$('ts');
  const d=document.createElement('div');d.className='tt '+cls;d.textContent=text;
  d.onclick=()=>d.remove();box.appendChild(d);
  while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>d.remove(),cls==='ok'?20000:45000);
}
function otherSound(){
  const a=ac();if(!a)return;
  for(let i=0;i<6;i++){
    const t=a.currentTime+i*.45,o=a.createOscillator(),g=a.createGain();
    o.type='square';o.frequency.value=i%2?620:880;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.4);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.42);
  }
}
function showSys(text,tag,loud){
  const opt={body:'',tag:tag,renotify:true,requireInteraction:loud,vibrate:loud?[500,200,500,200,500]:[200],silent:false};
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.controller){
      navigator.serviceWorker.ready.then(r=>r.showNotification(text,opt)).catch(()=>{});return;
    }
  }catch(e){}
  try{new Notification(text,opt)}catch(e){}
}
/* kind: start | up | down | clear | other ; sweeps: 2 = жовтий, 4 = червоний */
function fire(text,kind,tag,sweeps){
  toast(text,kind==='clear'?'ok':kind==='down'?'wn':kind==='start'||kind==='other'?'al':'up');
  if(store.get('snd',true)){try{
    if(kind==='clear')clearSound();else if(kind==='other')otherSound();else if(kind==='down')sirenSound(2);else sirenSound(sweeps);
  }catch(e){}}
  try{navigator.vibrate&&navigator.vibrate(kind==='clear'?[200]:[500,200,500,200,500])}catch(e){}
  if(store.get('ntf',false)&&window.Notification&&Notification.permission==='granted')showSys(text,tag,kind!=='clear');
  try{document.title=text.slice(0,2)+' Карта тривог'}catch(e){}
}
addEventListener('focus',()=>{document.title='Карта тривог'});
const NS_={};
function otherKinds(it){
  const now=Date.now(),live=POLL*5,us=it.u?[unitById[it.u]]:(unitsByObl[it.o]||[]),set=new Set();
  us.forEach(u=>{if(u)(OLOG[u.i]||[]).forEach(x=>{if(now-x[2]<live)set.add(x[0])})});
  return set;
}
function checkNotify(){
  if(!SAVED.length)return;
  const now=Date.now(),prev=store.get('prev',{});
  SAVED.forEach(it=>{
    const s=statusOf(it),lvl=s?s.lvl:0;
    let st=NS_[it.k];
    if(!st){const p=prev[it.k];st=NS_[it.k]={lvl:p&&now-p.t<600000?p.lvl:lvl,pend:0,ok:{}}}
    if(lvl===st.lvl){st.pend=0}
    else if(lvl>st.lvl){
      fire(st.lvl===0?MSG.start(it.n,lvl):MSG.up(it.n),st.lvl===0?'start':'up',it.k,lvl===1?2:4);
      st.lvl=lvl;st.pend=0;
    }else{
      st.pend++;
      if(st.pend>=2){
        fire(lvl===0?MSG.clear(it.n):MSG.down(it.n),lvl===0?'clear':'down',it.k);
        st.lvl=lvl;st.pend=0;
      }
    }
    const ks=otherKinds(it);
    ['street','chem','rad'].forEach(k=>{
      const on=ks.has(k),was=!!st.ok[k];
      if(on&&!was){st.ok[k]=1;fire(MSG[k](it.n),'other',it.k+k)}
      else if(!on&&was){st.ok[k]=0;fire(MSG.oclear(k,it.n),'clear',it.k+k)}
    });
  });
  const o={};SAVED.forEach(it=>{if(NS_[it.k])o[it.k]={lvl:NS_[it.k].lvl,t:now}});
  store.set('prev',o);
}
let WL=null;
async function wake(on){
  try{
    if(on){if(navigator.wakeLock&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}
    else if(WL){await WL.release();WL=null}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&store.get('wake',false))wake(true)});
if(store.get('wake',false))wake(true);
function swRow(id,title,sub,on){
  return '<div class="thr"><div><b>'+title+'</b><small style="color:#8e8e93;font-size:12px;display:block;margin-top:2px">'+sub+'</small></div><label class="sw"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+'><span></span></label></div>';
}
function renderSettings(){
  $('vs').innerHTML='<div class="wrap"><div class="sec">Notifications</div><div class="card">'
   +swRow('o_snd','Alarm sound','Siren on alert, chime on all-clear',store.get('snd',true))
   +swRow('o_ntf','System notifications','Where the browser supports them',store.get('ntf',false))
   +swRow('o_wake','Keep screen on','Keeps the page running so alerts keep coming',store.get('wake',false))
   +'</div><button class="lk" id="t3">Test: yellow level</button><button class="lk" id="t1">Test: red level</button><button class="lk" id="t4">Test: chemical threat</button><button class="lk" id="t2">Test: all clear</button>'
   +'<div class="ver" style="text-align:left;margin:0 6px 4px">Alerts and sound work while this page is open. Messages are sent for the regions saved on the Alerts tab.</div>'
   +'<div class="sec">Regions</div><div class="card"><div class="row" style="cursor:default"><div><b>Saved regions</b><small>'+SAVED.length+'</small></div></div></div><button class="lk red" id="s1">Remove all saved regions</button>'
   +'<div class="sec">Data on this device</div><button class="lk red" id="s2">Reset alert level log</button><div class="ver">Version alert-map</div></div>';
  $('o_snd').onchange=e=>{store.set('snd',e.target.checked);if(e.target.checked)ac()};
  $('o_ntf').onchange=async e=>{
    if(!e.target.checked){store.set('ntf',false);return}
    let ok=false;
    try{if(window.Notification){ok=Notification.permission==='granted'||(await Notification.requestPermission())==='granted'}}catch(x){}
    store.set('ntf',ok);e.target.checked=ok;
    if(!ok)toast('System notifications are not available in this browser. Sound and on-screen messages still work.','up');
  };
  $('o_wake').onchange=e=>{store.set('wake',e.target.checked);wake(e.target.checked)};
  $('t1').onclick=()=>{ac();fire(MSG.start('Кропивницький район',2),'start','test',3)};
  $('t2').onclick=()=>{ac();fire(MSG.clear('Кропивницький район'),'clear','test')};
  $('t3').onclick=()=>{ac();fire(MSG.yellow('Кропивницький район'),'start','test',2)};
  $('t4').onclick=()=>{ac();fire(MSG.chem('Кропивницький район'),'other','test')};
  $('s1').onclick=()=>{if(confirm('Remove all saved regions?')){SAVED=[];store.set('saved',SAVED);renderSettings()}};
  $('s2').onclick=()=>{if(confirm('Reset the alert level and threat log?')){LOG={};OLOG={};try{localStorage.removeItem('lvlog');localStorage.removeItem('olog')}catch(e){}}};
}

try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
showTab(TAB);

tick();setInterval(tick,POLL);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
